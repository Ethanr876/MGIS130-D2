<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Loan Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Loan Calculator</h1>

    <form id="loan-form" novalidate>
      <label for="amount">Loan amount ($)</label>
      <input id="amount" name="amount" type="number" inputmode="decimal"
             min="0" step="any" value="20000" required>

      <label for="rate">Annual interest rate (%)</label>
      <input id="rate" name="rate" type="number" inputmode="decimal"
             min="0" step="any" value="6.5" required>

      <label for="term">Loan term</label>
      <div class="term-row">
        <input id="term" name="term" type="number" inputmode="numeric"
               min="1" step="1" value="5" required>
        <select id="term-unit" name="termUnit" aria-label="Term unit">
          <option value="years" selected>Years</option>
          <option value="months">Months</option>
        </select>
      </div>

      <button type="submit">Calculate</button>
    </form>

    <p id="errors" class="errors" role="alert" hidden></p>

    <section id="results" aria-live="polite" hidden>
      <p class="label">Monthly payment</p>
      <p id="monthly" class="big-number"></p>

      <div class="chart-wrap">
        <div id="pie" class="pie" role="img" aria-label="Pie chart of principal versus interest"></div>
        <ul class="legend">
          <li><span class="swatch principal"></span>Principal
            <strong id="principal-total"></strong>
            <span id="principal-pct" class="pct"></span></li>
          <li><span class="swatch interest"></span>Interest
            <strong id="interest-total"></strong>
            <span id="interest-pct" class="pct"></span></li>
        </ul>
      </div>

      <dl class="summary">
        <div><dt>Number of payments</dt><dd id="payments"></dd></div>
        <div><dt>Total paid</dt><dd id="total-paid"></dd></div>
      </dl>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
